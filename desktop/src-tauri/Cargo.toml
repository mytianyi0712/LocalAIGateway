[package]
name = "local-ai-gateway"
version = "0.2.5"
edition = "2024"
description = "Cross-platform local AI gateway"
license = "MIT"
build = "build.rs"

[lib]
name = "local_ai_gateway"
path = "src/lib.rs"

[[bin]]
name = "local-ai-gateway"
path = "src/main.rs"

[[bin]]
name = "gateway-headless"
path = "src/bin/gateway-headless.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "macros", "query"] }
base64 = "0.22"
brotli = "8.0.4"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
flate2 = { version = "1.1", features = ["zlib-rs"] }
futures-util = "0.3"
http = "1.3"
http-body-util = "0.1"
mime_guess = "2.0"
open = "5.3"
parking_lot = "0.12"
percent-encoding = "2.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "json", "migrate", "macros"] }
# common-controls-v6 (a tauri default) hard-links TaskDialogIndirect, which is
# only exported by the comctl32 v6 side-by-side assembly (System32 holds the
# v5.82 baseline). The MinGW/GNU linker drops tauri's SxS manifest with
# ".rsrc merge failure: multiple non-default manifests", so v6 is never
# activated, the import resolves against v5.82 and the binary fails to start
# (0xc0000139). MSVC builds merge the manifest and are unaffected; disabling
# the feature uses the official MessageBoxW fallbacks in muda and
# tauri-runtime-wry — only TaskDialog cosmetics are lost.
tauri = { version = "2.11", default-features = false, features = ["tray-icon", "wry", "compression", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-autostart = "2"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.17", features = ["v4", "serde"] }
zstd = "0.13"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Desktop notifications: notify-rust 4.x covers Linux (D-Bus
# org.freedesktop.Notifications) and macOS only; Windows toast needs the
# separate winrt-notification backend.
[target.'cfg(not(target_os = "windows"))'.dependencies]
notify-rust = { version = "4", default-features = false, features = ["z"] }

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = "0.5"

[profile.release]
# codegen-units is kept at the default (16) and LTO is disabled: with
# `codegen-units = 1` (and/or `lto = "thin"`) the GNU ld on this toolchain
# silently drops the tail command registrations (commands taking a
# `WebviewWindow` argument) from the linked Linux binary — the debug build
# and the MinGW (Windows) link are unaffected. The loss is invisible until
# the missing command is invoked (e.g. the custom titlebar's minimize/close
# buttons). Cost of disabling LTO: marginally larger binary.
lto = false
opt-level = 3
panic = "abort"
strip = true
