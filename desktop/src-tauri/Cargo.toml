[package]
name = "local-ai-gateway"
version = "0.2.0"
edition = "2024"
description = "Cross-platform local AI gateway"
license = "MIT"
build = "build.rs"

[lib]
name = "local_ai_gateway"
path = "src/lib.rs"

[[bin]]
name = "local-ai-gateway"
path = "src/main.rs"

[[bin]]
name = "gateway-headless"
path = "src/bin/gateway-headless.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "macros", "query"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
flate2 = "1.1"
futures-util = "0.3"
http = "1.3"
http-body-util = "0.1"
mime_guess = "2.0"
open = "5.3"
percent-encoding = "2.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "json", "migrate", "macros"] }
tauri = { version = "2.11", features = ["tray-icon"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.17", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
