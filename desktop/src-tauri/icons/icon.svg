<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Local AI Gateway — application icon
    Semantic: a local AI protocol gateway: one core node routing traffic in
    four directions (clients ↔ local providers). Hub-and-spoke glyph in
    negative space, legible from 16 px up.
    Palette: project teal (#14b8a6) through cyan (#0e7490) to indigo (#3730a3),
    with a near-white mark for high contrast on both light and dark desktops.
  -->
  <title>Local AI Gateway</title>
  <defs>
    <linearGradient id="gateway-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.55" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square tile with a transparent safe margin -->
  <rect x="24" y="24" width="976" height="976" rx="216" fill="url(#gateway-tile)"/>

  <!-- Gateway hub mark: core node plus four routing ports -->
  <g fill="#f7fffe">
    <circle cx="512" cy="512" r="150"/>
    <rect x="456" y="176" width="112" height="186" rx="56"/>
    <rect x="456" y="662" width="112" height="186" rx="56"/>
    <rect x="176" y="456" width="186" height="112" rx="56"/>
    <rect x="662" y="456" width="186" height="112" rx="56"/>
  </g>
</svg>
