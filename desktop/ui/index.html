<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Local AI Gateway</title>
  <link rel="stylesheet" href="./launcher.css">
  <script type="module" src="./launcher.js"></script>
</head>
<body>
  <header class="titlebar" data-tauri-drag-region="deep">
    <span class="titlebar-title">Local AI Gateway</span>
    <div class="titlebar-buttons">
      <button id="minimize-btn" class="titlebar-button" type="button" aria-label="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M1 6h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="close-btn" class="titlebar-button close" type="button" aria-label="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>
  <main class="shell">
    <section class="address-card" aria-live="polite">
      <div class="address-head">
        <span class="address-label">网关地址</span>
        <span class="status-badge">
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <span id="status-label">正在启动</span>
        </span>
      </div>
      <code id="status-detail" class="gateway-url">http://127.0.0.1:3000</code>
      <p id="status-error" class="status-error" hidden></p>
    </section>

    <form id="port-form" class="port-form">
      <label for="port">接口端口</label>
      <div class="port-row">
        <input id="port" name="port" type="number" min="1024" max="65535" inputmode="numeric" required>
        <button class="button secondary" type="submit">保存并重启</button>
      </div>
      <p id="port-hint" class="hint">可用端口范围：1024-65535</p>
    </form>

    <button id="open-dashboard" class="button primary" type="button">打开网关主页</button>

    <section class="settings-card" aria-label="启动选项">
      <h2 class="settings-title">启动选项</h2>
      <label class="setting-row" for="autostart">
        <span class="setting-text">
          <span class="setting-name">开机自启动</span>
          <span class="setting-desc">登录系统后自动运行网关</span>
        </span>
        <input id="autostart" class="switch" type="checkbox">
      </label>
      <label class="setting-row" for="start-to-tray">
        <span class="setting-text">
          <span class="setting-name">启动时最小化到托盘</span>
          <span class="setting-desc">启动后不显示主界面，仅保留托盘图标</span>
        </span>
        <input id="start-to-tray" class="switch" type="checkbox">
      </label>
      <p id="settings-hint" class="hint" hidden></p>
    </section>
  </main>
</body>
</html>
