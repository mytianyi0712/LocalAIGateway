<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f7f5" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" />
    <title>Local AI Gateway</title>
    <link rel="icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="i-gateway" viewBox="0 0 24 24"><path d="M4 12h5M9 12c3 0 3-6 7-6h4M9 12h11M9 12c3 0 3 6 7 6h4"/><circle cx="4" cy="12" r="1.25"/><circle cx="20" cy="6" r="1.25"/><circle cx="20" cy="12" r="1.25"/><circle cx="20" cy="18" r="1.25"/></symbol>
      <symbol id="i-layout-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="i-network" viewBox="0 0 24 24"><rect x="16" y="16" width="5" height="5" rx="1"/><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><path d="M5.5 8v5.5a2.5 2.5 0 0 0 2.5 2.5h8M8 5.5h5.5a2.5 2.5 0 0 1 2.5 2.5V16"/></symbol>
      <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v5a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3"/><path d="M12 5h6"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
      <symbol id="i-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.56V20.3h-3v-.08a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06L6.6 16.94l.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.56-1.04H5.3v-3h.14A1.7 1.7 0 0 0 7 9.92a1.7 1.7 0 0 0-.34-1.88L6.6 7.98 8.72 5.86l.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 11.7 4.7v-.08h3v.08a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.04h.14v3h-.14A1.7 1.7 0 0 0 19.4 15Z"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-refresh-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8.3M3 3v5.3h5.3M3 12a9 9 0 0 0 15.5 6.2l2.5-2.5M21 21v-5.3h-5.3"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
      <symbol id="i-trash-2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
      <symbol id="i-key-round" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m11 12 7-7M15 5l4 4M14 9l2 2"/></symbol>
      <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></symbol>
      <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 7h.01M7 18h.01"/></symbol>
      <symbol id="i-shield-check" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-grip-vertical" viewBox="0 0 24 24"><circle cx="9" cy="5" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="19" r="1"/></symbol>
    </svg>

    <div class="app-shell">
      <a class="skip-link" href="#main-content">跳到主要内容</a>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-gateway"></use></svg></div>
          <div class="brand-copy"><strong>Local AI Gateway</strong><span>本地路由控制台</span></div>
          <button class="icon-button sidebar-close" type="button" data-action="close-sidebar" aria-label="关闭导航" title="关闭导航"><svg class="icon"><use href="#i-x"></use></svg></button>
        </div>
        <div class="nav-label">工作区</div>
        <nav class="navigation" aria-label="主导航">
          <a class="nav-item" href="/" data-route="/"><svg class="icon"><use href="#i-layout-dashboard"></use></svg><span>概览</span></a>
          <a class="nav-item" href="/providers" data-route="/providers"><svg class="icon"><use href="#i-network"></use></svg><span>供应商与渠道</span></a>
          <a class="nav-item" href="/routes" data-route="/routes"><svg class="icon"><use href="#i-route"></use></svg><span>模型路由</span></a>
          <a class="nav-item" href="/profiles" data-route="/profiles"><svg class="icon"><use href="#i-database"></use></svg><span>能力档案</span></a>
          <a class="nav-item" href="/mappings" data-route="/mappings"><svg class="icon"><use href="#i-shuffle"></use></svg><span>Claude 映射</span></a>
          <a class="nav-item" href="/codex-mappings" data-route="/codex-mappings"><svg class="icon"><use href="#i-shuffle"></use></svg><span>Codex 映射</span></a>
          <a class="nav-item" href="/logs" data-route="/logs"><svg class="icon"><use href="#i-file-text"></use></svg><span>请求日志</span></a>
          <a class="nav-item" href="/settings" data-route="/settings"><svg class="icon"><use href="#i-settings"></use></svg><span>运行设置</span></a>
        </nav>
        <div class="sidebar-footer">
          <div class="connection-summary">
            <span class="connection-state" id="side-status"><i></i>正在连接</span>
            <span id="side-mode">检查访问策略</span>
          </div>
          <button class="icon-button lock-button" id="lock-button" type="button" data-action="lock-console" aria-label="锁定控制台" title="锁定控制台" hidden><svg class="icon"><use href="#i-lock"></use></svg></button>
        </div>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <button class="icon-button mobile-menu" type="button" data-action="open-sidebar" aria-label="打开导航" title="打开导航"><svg class="icon"><use href="#i-menu"></use></svg></button>
          <div class="topbar-heading"><h1 id="page-title">运行概览</h1><p id="page-description">请求、Token 与渠道健康状态</p></div>
          <div class="topbar-meta" aria-label="网关连接状态">
            <span class="topbar-endpoint" id="top-endpoint"></span>
            <span class="topbar-state" id="top-status"><i></i>连接中</span>
          </div>
        </header>
        <main id="main-content" class="workspace" tabindex="-1"><div id="page-content"></div></main>
      </div>
      <div class="sidebar-scrim" id="sidebar-scrim" data-action="close-sidebar"></div>
    </div>

    <dialog class="modal" id="modal" aria-labelledby="modal-title">
      <div class="modal-frame" id="modal-frame">
        <header class="modal-header"><h2 id="modal-title"></h2><button class="icon-button" type="button" data-action="close-modal" aria-label="关闭" title="关闭"><svg class="icon"><use href="#i-x"></use></svg></button></header>
        <div class="modal-body" id="modal-body"></div>
        <footer class="modal-footer" id="modal-footer"></footer>
      </div>
    </dialog>

    <section class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title">
      <div class="drawer-backdrop" data-action="close-drawer"></div>
      <div class="drawer-panel" role="dialog" aria-modal="true">
        <header class="drawer-header"><div><h2 id="drawer-title"></h2><p id="drawer-subtitle"></p></div><button class="icon-button" type="button" data-action="close-drawer" aria-label="关闭" title="关闭"><svg class="icon"><use href="#i-x"></use></svg></button></header>
        <div class="drawer-body" id="drawer-body"></div>
        <footer class="drawer-footer" id="drawer-footer"></footer>
      </div>
    </section>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
