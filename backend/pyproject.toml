[project]
name = "local-ai-gateway"
version = "0.1.0"
description = "Local transparent AI gateway with same-protocol failover"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "aiosqlite>=0.21.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "ijson>=3.4.0",
  "pydantic-settings>=2.10.0",
  "sqlalchemy>=2.0.41",
  "uvicorn[standard]>=0.35.0",
  "brotli>=1.1.0",
  "zstandard>=0.23.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
